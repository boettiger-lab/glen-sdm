<!doctype html><html><head><meta charset="utf-8">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>html,body,#m{margin:0;height:100%}</style></head><body><div id="m"></div><script>
const P = new URLSearchParams(location.search);
const kind = P.get("kind"), src = P.get("src"), z = +P.get("z") || 6;
const map = new maplibregl.Map({container: "m", center: [-120.5, 37.3], zoom: z,
  style: {version: 8, sources: {}, layers: [{id: "bg", type: "background", paint: {"background-color": "#eee"}}]}});
const color = ["interpolate", ["linear"], ["get", kind === "vector" ? "suitability" : "s"], 0, "#440154", 0.5, "#21918c", 1, "#fde725"];
map.on("load", () => {
  const t0 = performance.now();
  if (kind === "vector") map.addSource("x", {type: "vector", tiles: [src], minzoom: 0, maxzoom: 14});
  else map.addSource("x", {type: "geojson", data: src});
  const lyr = {id: "x", source: "x", type: kind === "range" ? "line" : "fill",
    paint: kind === "range" ? {"line-color": "#f40"} : {"fill-color": color, "fill-opacity": 0.8}};
  if (kind === "vector") lyr["source-layer"] = "layer";
  map.addLayer(lyr);
  map.once("idle", () => { window.RESULT = [Math.round(performance.now() - t0), map.queryRenderedFeatures({layers: ["x"]}).length]; });
});
</script></body></html>
